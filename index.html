<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linden Physio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="services.css">
</head>
<body>
  <h1>Linden Physio</h1>
  <p>Physiotherapy in the middle of town. Book a time that suits you.</p>
  <section class="services">
    <h2>Services</h2>
    <ul>
      <li>First visit, 60 minutes</li>
      <li>Follow-up, 30 minutes</li>
      <li>Sports massage, 45 minutes</li>
    </ul>
    <button class="book">Book</button>
  </section>
  <section class="times">
    <h2>Free times</h2>
    <label>Service
      <select id="service">
        <option value="60">First visit, 60 minutes</option>
        <option value="30">Follow-up, 30 minutes</option>
        <option value="45">Sports massage, 45 minutes</option>
      </select>
    </label>
    <label>Day <input type="date" id="day" value="2026-11-10"></label>
    <p id="count"></p>
    <ul id="free-times"></ul>
    <p id="summary">No time picked yet.</p>
    <form id="details">
      <label>Your name <input name="name" required autocomplete="name"></label>
      <label>Email <input name="email" type="email" required autocomplete="email"></label>
      <button class="book">Book</button>
      <p id="message" role="status"></p>
    </form>
  </section>
  <p><a href="mailto:hello@lindenphysio.com">Email us</a></p>
  <script type="module" src="dist/booking.js"></script>
</body>
</html>
