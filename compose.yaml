# Postgres for this computer, the same major version as production, Mailpit to catch mail, and Jaeger
# to read traces.
#   docker compose up -d     starts it in the background
#   docker compose down      stops it (the data stays in the volume)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: linden
      POSTGRES_PASSWORD: linden
      POSTGRES_DB: linden
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, when the volume is new: makes the tests' database too, and the stand-ins'.
      - ./docker/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql

  # Catches the mail the app sends on this computer, so nothing reaches a real inbox.
  # Read it at http://localhost:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Reads the traces the app sends (src/instrumentation.ts) at http://localhost:16686.
  jaeger:
    image: jaegertracing/jaeger:2.12.0
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  postgres-data:
